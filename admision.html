<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admisión — Hospital Regional Eleazar Guzmán Barrón</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styleAdmi.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>

<body>
    <script>
        // Candado de acceso: si no inició sesión en login_intranet.html, no puede
        // ver este panel. Se ejecuta antes de pintar cualquier contenido.
        if (sessionStorage.getItem("isLogged") !== "true") {
            window.location.href = "login_intranet.html";
        }
    </script>

    <!-- PANEL DE ADMISIÓN / AUDITORÍA -->
    <div class="admision-container">
        <header class="admision-header">
            <div class="admision-header__row">
                <div>
                    <h2>Panel de Admisión y Control — Hospital Regional</h2>
                    <p>Auditoría de pre-solicitudes web y gestión de referencias REFCON</p>
                </div>
                <div class="admision-header__actions">
                    <button class="btn-action btn-reset" id="btnLimpiarDatos" type="button">Limpiar datos de prueba</button>
                    <button class="btn-action btn-logout" id="btnCerrarSesion" type="button">Cerrar sesión</button>
                </div>
            </div>
        </header>

        <div class="table-wrapper">
            <table class="admision-table">
                <thead>
                    <tr>
                        <th>ID Cita</th>
                        <th>Paciente / DNI</th>
                        <th>Especialidad / Médico</th>
                        <th>Fecha y Hora</th>
                        <th>REFCON / Cód.</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaAdmisionBody">
                    <!-- Se llena dinámicamente con JS -->
                </tbody>
            </table>
        </div>
        <div class="correos-log">
            <h3>Bandeja de correos enviados a pacientes (simulación)</h3>
            <div class="table-wrapper">
                <table class="admision-table">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Destinatario</th>
                            <th>Asunto</th>
                            <th>Detalle</th>
                        </tr>
                    </thead>
                    <tbody id="correosLogBody">
                        <!-- Se llena dinámicamente con JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="admision.js"></script>
</body>
</html>
