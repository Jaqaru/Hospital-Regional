<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intranet - Hospital Regional</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="login-wrapper">
    <div class="login-box">
      <div class="login-header">
        <!-- Puedes poner el logo del MINSA o del Hospital aquí -->
        <h2>🏥 Intranet Hospitalaria</h2>
        <p>Módulo de Admisión y LOLCLI 9000</p>
      </div>

      <form id="formLogin">
        <div class="input-group">
          <label for="usuario">Usuario (DNI Institucional)</label>
          <input type="text" id="usuario" placeholder="Ej: 45678912" required>
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <div id="loginError" class="msg-error" hidden>
          Credenciales incorrectas. Verifique su acceso.
        </div>

        <button type="submit" class="btn-login">Ingresar al Sistema</button>
      </form>
      
      <div class="login-footer">
        <a href="index.html"> Portal de Pacientes</a>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
